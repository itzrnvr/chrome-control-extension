<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; width: 250px; margin: 0; padding: 14px; color: #1a1a1a; }
    h1 { font-size: 13px; margin: 0 0 3px; }
    p  { margin: 0 0 10px; color: #6b7280; }
    .row { display: flex; align-items: center; gap: 7px; padding: 5px 0; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #c4c7c5; flex: none; }
    .dot.on { background: #1aad19; }
    .dot.off { background: #d93025; }
    code { font-size: 11px; background: #f1f3f4; padding: 1px 4px; border-radius: 3px; }
    button { margin-top: 10px; width: 100%; padding: 7px; border: 1px solid #dadce0;
             background: #f8f9fa; border-radius: 4px; cursor: pointer; font: inherit; }
    button:hover { background: #f1f3f4; }
  </style>
</head>
<body>
  <h1>Chrome Control</h1>
  <p>Bridge endpoint <code>127.0.0.1:8765</code>.</p>
  <div class="row"><span class="dot" id="d"></span><span id="s">checking...</span></div>
  <div class="row"><span class="dot" id="dv"></span><span>tabs available: <b id="n">-</b></span></div>
  <button id="r">Refresh</button>
  <script src="popup.js"></script>
</body>
</html>
